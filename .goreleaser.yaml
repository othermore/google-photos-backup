version: 2
project_name: gpb

builds:
  - main: ./main.go
    binary: gpb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin    # 'darwin' means macOS in Go terminology
    goarch:
      - amd64     # Intel CPUs
      - arm64     # Apple Silicon (M1/M2/M3) and Linux ARM

archives:
  - format: tar.gz
    # This automatically packages the binary along with essential files
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - README.es.md
      - config.yaml.example

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
