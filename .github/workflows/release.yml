name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on any tag starting with v (e.g., v1.0.0, v0.9.0)

permissions:
  contents: write # Needed to create the GitHub Release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by GoReleaser to generate correct changelogs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Specify the Go version your project uses

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
